services:
  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222"   # クライアント接続
      - "8222:8222"   # HTTP モニタリング
    command: ["--http_port", "8222"]

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    ports:
      - "8080:8080"
    environment:
      - NATS_URL=nats://nats:4222
    depends_on:
      - nats
