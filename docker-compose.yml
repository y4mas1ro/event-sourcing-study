services:
  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222"   # クライアント接続
      - "8222:8222"   # HTTP モニタリング
    command: ["--http_port", "8222"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eventsourcing
      POSTGRES_PASSWORD: password
      POSTGRES_DB: eventsourcing
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventsourcing"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    ports:
      - "8080:8080"
    environment:
      - NATS_URL=nats://nats:4222
      - DATABASE_URL=postgres://eventsourcing:password@postgres:5432/eventsourcing?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started

  subscriber:
    build:
      context: .
      dockerfile: Dockerfile
      target: subscriber
    environment:
      - NATS_URL=nats://nats:4222
      - DATABASE_URL=postgres://eventsourcing:password@postgres:5432/eventsourcing?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
